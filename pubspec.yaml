name: ekatimer
description: "A beautiful modern meditation timer app for iOS and Android."
publish_to: 'none'
version: 1.0.28+2031

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0
  vibration: ^3.0.0
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  home_widget: ^0.9.2
  archive: ^3.6.1

  wakelock_plus: ^1.2.10
  alarm: ^5.4.1
  permission_handler: ^12.0.2

  # for importing and exporting Meditation Timer data as CSV
  csv: ^8.0.0
  file_picker: ^10.3.9
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # to generate app icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/translations/
    - assets/quotes/
    - assets/images/launch_image.png

# dart run flutter_launcher_icons to generate Android app icons
# for iOS, use Icon Composer better.

flutter_launcher_icons:
  android: true
  ios: false

  # This tracked image is the canonical ekaTimer launcher artwork. Regenerate
  # the standard and adaptive Android resources together after changing it.
  image_path: "images/ekaTimer_BrownbgZoomLotus.png"

  adaptive_icon_foreground: "images/ekaTimer_BrownbgZoomLotus.png"
  adaptive_icon_background: "#FFFFFF"
